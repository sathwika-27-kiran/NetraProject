<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA Robot Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header portion of the page-->
    <header class="top-header">
        <div class="banner">
            <!-- Logo-->
            <div class="logo">
                N
            </div>
            <div>
                <h1> NETRA </h1>
                <p>ROBOT MiSSION CONTROL</p>
            </div>
        </div>

        <!-- Navigation bar-->
        <nav class="navbar">
            <a href="#">Dashboard</a>
            <a href="#">Telemetry</a>
            <a href="#">Fleet</a>
            <a href="#">Alerts</a>
        </nav>

        <!-- System time-->
        <div class="system-time">
            <span class="online-dot"></span> 
            <span>SYSTEM ONLINE</span> 
            <strong id="clock">--:--:--</strong>
        </div>

        <div class="Dispatch-button">
            <button>+DISPATCH MISSION</button>
        </div>
    </header>
    
    <script src="script.js">  </script>
</body>
</html>
